name: 'Build and Push to GHCR'

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  DEFAULT_MUSIC_FOLDER: /tmp/music
  EXCLUDED_TEST_GROUPS:

jobs:
  build-war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - run: mkdir -p ${DEFAULT_MUSIC_FOLDER}

      - name: Build with Maven
        run: mvn install -DskipTests -B -P docker

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: airsonic-war
          path: install/docker/target/dependency/airsonic-main.war
          retention-days: 1

      - name: Calculate tags
        id: meta
        run: |
          ver=$(grep "version=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          ts=$(grep "timestamp=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          echo "tag=$ver.$ts" >> $GITHUB_OUTPUT

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-war
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: airsonic-war
          path: install/docker/target/dependency/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/airsonic-advanced:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/airsonic-advanced:buildcache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/airsonic-advanced:latest
            ghcr.io/${{ github.repository_owner }}/airsonic-advanced:${{ needs.build-war.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/airsonic-advanced:gitcommit-${{ github.sha }}
